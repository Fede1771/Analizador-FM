<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><title>Touchline · Analizador FM26</title>
  <link rel="icon" href="/touchline.ico"><link rel="stylesheet" href="/style.css?v=10">
</head>
<body>
  <a class="skip-link" href="#content">Ir al contenido</a>
  <aside id="sidebar" hidden>
    <div class="sidebar-header">
      <a class="brand" href="#overview" title="Touchline · Football Intelligence">
        <span class="brand-mark" aria-hidden="true">T·</span>
        <span class="brand-text">touchline<small>FOOTBALL INTELLIGENCE</small></span>
      </a>
      <button id="sidebar-toggle" class="sidebar-toggle-btn" type="button" aria-label="Alternar menú lateral" title="Colapsar menú (ganar espacio)">
        <svg class="toggle-svg" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
    <p class="workspace-label">TU CLUB</p>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <div class="sidebar-footer">
      <p class="local-badge" title="Tu partida, en tu equipo (Procesamiento local · FM26)">
        <span class="badge-dot" aria-hidden="true">●</span>
        <span class="badge-text">Tu partida, en tu equipo<small>Procesamiento local · FM26</small></span>
      </p>
      <button class="text-button shutdown-btn" data-action="shutdown" title="Cerrar Touchline">
        <svg class="nav-svg shutdown-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="shutdown-text">Cerrar Touchline</span>
      </button>
    </div>
  </aside>
  <div class="main-shell"><header class="topbar"><a class="mobile-brand" href="#overview">touchline</a><span id="source-label">Análisis local · FM26</span><div class="actions"><button class="button" id="sync-button" data-action="sync">Sincronización</button><button class="button" id="groups-button" data-action="groups" hidden>Grupos</button><button class="button accent" id="companion-button" data-action="companion" hidden title="Abrir mini-guía flotante para jugar en FM">Guía para FM</button><button class="button primary" data-action="import">Importar partida</button><button class="button" data-action="shutdown" aria-label="Cerrar Touchline">Salir</button></div></header>
  <div id="activity" class="activity" role="status" aria-live="polite" hidden><strong id="activity-text"></strong><progress id="activity-progress" max="100" aria-label="Progreso de la importación"></progress><small id="snapshot-note"></small></div>
  <main id="content"><p class="empty" role="status">Preparando tu club…</p></main><footer>TOUCHLINE <span>Índice propio de encaje · Recomendaciones para probar en FM26</span></footer></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><button id="dialog-close" class="dialog-close" aria-label="Cerrar ventana">×</button><div id="dialog-body"></div></dialog>
  <input id="save-file" type="file" accept=".fm" hidden>
  <script type="module" src="/app.js?v=12"></script>
</body>
</html>
